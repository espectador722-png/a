<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Entrar · Biblioteca de Manga</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/vendor/bootstrap-icons/font/bootstrap-icons.css">
<style>
:root{--bg:#0f0f0f;--surface:#1a1a20;--border:rgba(255,255,255,.1);--text:#eee;--muted:#9a98a8;--accent:#ec407a;--danger:#ef7b78}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 24px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand img{width:36px;height:36px}
.brand h1{font-size:19px;margin:0}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{color:var(--danger);font-size:13px;min-height:1.2em;margin-top:12px}
.aviso{background:rgba(236,64,122,.08);border:1px solid rgba(236,64,122,.3);border-radius:9px;padding:12px;font-size:13px;color:var(--muted);margin-bottom:6px}
.aviso code{color:var(--text)}
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
  <div class="brand">
    <img src="/static/favicon.svg" alt="">
    <h1>Biblioteca de Manga</h1>
  </div>
  {% if sin_usuarios %}
  <div class="aviso">
    <i class="bi bi-info-circle"></i> Todavía no hay cuentas. Definí la variable
    <code>ADMIN_PASSWORD</code> y reiniciá el servidor para crear el administrador.
  </div>
  {% endif %}
  <label for="usuario">Usuario</label>
  <input id="usuario" name="usuario" autocomplete="username" autocapitalize="off" required autofocus>
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" id="entrar"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
  <div class="msg" id="msg" role="alert"></div>
</form>
<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const btn = document.getElementById('entrar');
form.addEventListener('submit', async e => {
  e.preventDefault();
  msg.textContent = '';
  btn.disabled = true;
  try {
    const next = new URLSearchParams(location.search).get('next') || '/manga';
    const r = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario: form.usuario.value, password: form.password.value, next }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.success) { location.href = d.next || '/manga'; return; }
    msg.textContent = d.error || 'No se pudo entrar';
    form.password.select();
  } catch {
    msg.textContent = 'Error de conexión';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
